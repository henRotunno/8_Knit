{% extends "base.html" %}

{% block title %}
    Recommendations
{% endblock %}


<!------------------------------------------------------------>
<!-- Block: Content -->

{% block content %}
  <div class="container text-center mt-3">

    <h2 class="mb-3">Recommendations</h2>
    <h2 class="mb-3">Find an activity</h2>

    <!-- Controls -->
    <div class="d-flex justify-content-center align-items-center gap-2 flex-wrap mb-3">
      <select id="type" class="form-select w-auto">
        <option>education</option><option>recreational</option><option>social</option>
        <option>diy</option><option>charity</option><option>cooking</option>
        <option>relaxation</option><option>music</option><option>busywork</option>
      </select>

      <select id="participants" class="form-select w-auto">
        <option value="">Any number of people</option>
        <option value="1">Just me</option>
        <option value="2">2 people</option>
        <option value="3">3 people</option>
        <option value="4">4 people</option>
      </select>

      <button id="search" class="btn btn-primary">Search</button>
    </div>

    <p id="status"></p>
    <ul id="results" class="list-unstyled"></ul>

  </div>


    <script>
document.getElementById("search").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const list = document.getElementById("results");
  list.innerHTML = "";
  status.textContent = "Loading...";

  const params = new URLSearchParams({ q: document.getElementById("type").value });
  const people = document.getElementById("participants").value;
  if (people) params.set("participants", people);

  try {
    const resp = await fetch(`{% url 'recommend_activity' %}?${params}`);
    const data = await resp.json();
    if (!resp.ok) { status.textContent = data.error; return; }

    const a = data.analytics;
    status.textContent = data.suggestions.length
      ? `${data.suggestions.length} suggestions | ${a.free_count} free | avg price score ${a.avg_price} (out of 1.0)`
      : "No matches. Try fewer people or a different type.";             <!-- inform of 0 to 1.0 price system -->
            <!-- send this message instead of scary api error 404 -->

    data.suggestions.forEach(s => {
      const li = document.createElement("li");
      li.textContent = `${s.activity} (${s.cost}, ${s.participants} ppl)` +
                       (s.already_in_our_app ? " - already in our app" : "");
                        <!-- check with db -->
      list.appendChild(li);
    });
  } catch (e) {
    status.textContent = "Something went wrong. Try again.";
  }
});
</script>
{% endblock %}
