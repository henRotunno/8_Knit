{% extends "base.html" %}

{% block title %}
    Recommendations
{% endblock %}


<!------------------------------------------------------------>
<!-- Block: Content -->

{% block content %}
  <div class="d-flex align-items-center justify-content-between mt-3">
    <h2 style="text-align:center;" class="mb-0">Recommendations</h2>
  </div>

  <div class="card mt-3">
    <div class="card-body p-3">
      <ul class="mb-0">
        {% for rec in recommendations %}
          <li class="mb-1">
            <a href="{{ rec.get_absolute_url }}">{{ rec }}</a>
          </li>
        {% empty %}
          <li class="text-muted">No recommendations yet!</li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
