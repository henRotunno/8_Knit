
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}illinois.edu{% endblock %}
    </title>
    <style>
    .navigation {
        text-align:center;
    }
    .navigation a {
        margin: 0 10px;
    }
    </style>

</head>
<body>

<div class="logo">
    <img
        src="{% static 'css/illinois_logo.png' %}"
        alt="Illinois Logo"
        style="width: 50px !important; height: auto !important;"
    >
</div>

    <div class="navigation">
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'friends' %}">Friends</a>
            <a href="{% url 'notifications' %}">Notifications</a>
            <a href="{% url 'recommendations' %}">Recommendations</a>
            <a href="{% url 'activities' %}">Activities</a>
        </nav>
    </div>

    {% block send_search %}
    {% endblock %}

    {% block filter %}
    {% endblock %}

    {% block content %}
    {% endblock %}
</body>
</html>
