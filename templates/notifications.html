{% extends "base.html" %}

{% block title %}
    Notifications
{% endblock %}

{% block content %}

<style>
  .page {
    max-width: 600px;      /* limits the width of the box */
    margin: 24px auto;     /* auto left/right = centers the box itself */
    padding: 0 16px;
    text-align: center;    /* centers the text inside it */
  }

  .card-box {
    margin-top: 24px;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: left;      /* names read normally inside the card */
  }

  .card-box ul { margin: 0; padding-left: 20px; }
  .card-box li { margin-bottom: 4px; }
  .muted { color: #6c757d; }
</style>

<div class="page">

  <h2>Notifications</h2>

  <div class="card-box">
    <ul>
      {% for noti in notifications %}
        <li><a href="{{ noti.get_absolute_url }}">{{ noti }}</a></li>
      {% empty %}
        <li class="muted">No notifications yet!</li>
      {% endfor %}
    </ul>
  </div>

</div>

{% endblock %}
