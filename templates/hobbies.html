{% extends "base.html" %}

{% block title %}
    Activities
{% endblock %}


<!------------------------------------------------------------>
<!-- Block: Content -->

{% block content %}
  <div class="d-flex align-items-center justify-content-between mt-3">
    <h2 class="mb-0">Activities</h2>
  </div>

  <div class="card mt-3">
    <div class="card-body p-3">
      <ul class="mb-0">
        {% for act in Activities %}
          <li class="mb-1">
            <a href="{{ act.get_absolute_url }}">{{ act }}</a>
          </li>
        {% empty %}
          <li class="text-muted">Hobby Hub</li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
