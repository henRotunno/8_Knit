{% extends "base.html" %}

{{% block content %}
  <div class="container text-center mt-3">

    <h2 class="mb-1">Friend List</h2>
    <p class="text-muted">Total friends: {{ count }}</p>

    <form method="post" class="row g-2 justify-content-center align-items-center mt-3">
      {% csrf_token %}
      <div class="col-12 col-sm-6 col-md-4">
        <input type="search" name="q" value="{{ q }}" class="form-control"
               placeholder="Search by name:">
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">Search</button>
        {% if q %}<a class="btn btn-outline-secondary ms-2" href="{% url 'friends' %}">Clear</a>{% endif %}
      </div>
    </form> <!-- csrf token is missing error, added token -->

    <div class="card mt-3 mx-auto" style="max-width: 500px;">
      <div class="card-body p-3">
        <ul class="list-unstyled mb-0">
          {% for friend in Friends %}
            <li class="mb-1">
              <a href="{{ friend.get_absolute_url }}">{{ friend }}</a>
            </li>
          {% empty %}
            <li class="text-muted">No friends yet!</li>
          {% endfor %}
        </ul>
      </div>
    </div>

  </div>
{% endblock %}
